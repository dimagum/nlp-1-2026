[project]
name = "nlp-1-2026"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "dmitrii.guminov", email = "daguminov@edu.hse.ru" }
]
requires-python = ">=3.12"
dependencies = [
    "faiss-cpu>=1.15.1",
    "gensim>=4.4.0",
    "ipykernel>=7.3.0",
    "matplotlib>=3.11.2",
    "nltk>=3.10.3",
    "numpy>=2.5.3",
    "pandas>=3.0.5",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
    "torch>=2.14.0",
    "transformers>=5.17.0",
    "unicode>=2.9",
    "unidecode>=1.4.0",
]

[project.scripts]
nlp-1-2026 = "nlp_1_2026:main"

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"
