[project]
name = "nlp-1-2026"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "dmitrii.guminov", email = "daguminov@edu.hse.ru" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "accelerate>=0.33,<0.36",
    "bitsandbytes>=0.48.1",
    "datasets==4.5.0",
    "faiss-cpu==1.15.0",
    "gensim==4.3.3",
    "huggingface-hub>=0.36.2",
    "ipykernel==7.3.0",
    "matplotlib>=3.11.2",
    "nltk==3.10.3",
    "numpy==1.26.4",
    "optimum>=1.20.0",
    "pandas>=3.0.5",
    "peft>=0.11.1",
    "protobuf==5.29.5",
    "scikit-learn>=1.5,<2",
    "scipy==1.13.1",
    "seaborn>=0.13.2",
    "sentencepiece==0.2.1",
    "smart-open==8.0.1",
    "torch>=2.14.0",
    "tqdm>=4.70.1",
    "transformers>=4.43,<4.46",
    "unicode>=2.9",
    "unidecode==1.4.0",
    "wrapt==2.3.0",
]

[project.scripts]
nlp-1-2026 = "nlp_1_2026:main"

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "ipywidgets>=8.1.9",
]
