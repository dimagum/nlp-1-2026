    "gensim==4.3.3",
    "ipykernel==7.3.0",
    "matplotlib>=3.11.2",
    "nltk==3.10.3",
    "numpy==1.26.4",
    "pandas>=3.0.5",
    "scikit-learn>=1.9.1",
    "scipy==1.13.1",
    "seaborn>=0.13.2",
    "smart-open==8.0.1",
    "torch>=2.14.0",
    "transformers>=5.17.0",
    "unicode>=2.9",
    "unidecode==1.4.0",
    "wrapt==2.3.0",
]

[project.scripts]
